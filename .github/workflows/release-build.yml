name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run unit checks
        run: npm run check:unit

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Package macOS app bundle
        run: |
          mkdir -p dist-installers/macos
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Expandso.app dist-installers/macos/Expandso-macos.app.zip

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: Expandso-macos
          path: dist-installers/macos/Expandso-macos.app.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run unit checks
        run: npm run check:unit

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipInstall -ArtifactDir dist-installers/windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Expandso-windows-installer
          path: dist-installers/windows/*setup.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download macOS asset
        uses: actions/download-artifact@v4
        with:
          name: Expandso-macos
          path: dist-release/macos

      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: Expandso-windows-installer
          path: dist-release/windows

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Expandso ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-release/macos/*
            dist-release/windows/*
